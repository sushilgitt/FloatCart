# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "FloatCart"
application_url = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io"
embedded = true
client_id = "9fa2579eeeae0eaae7addd77b7003f1e"

[build]
# Required so `shopify app deploy` pushes this app config (scopes/URLs/proxy/webhooks)
# to the Partner Dashboard — not just extensions. The Shopify CLI strips this on
# reformat; re-add it if a CLI run removes it again.
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products is a minimal NON-customer-data scope. The app needs no scopes of its
# own, but a token with ZERO scopes is forbidden from the Admin API (403 on every
# request). read_products unlocks Admin API access without re-triggering Protected
# Customer Data enforcement (which order/customer scopes like write_draft_orders did).
scopes = "read_products"

[auth]
redirect_urls = [ "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/auth/callback" ]

[app_proxy]
url = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/floating-cart"
subpath = "floating-cart"
prefix = "apps"

[pos]
embedded = false
