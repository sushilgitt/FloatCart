# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "FloatCart"
application_url = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io"
embedded = true
client_id = "9fa2579eeeae0eaae7addd77b7003f1e"

[build]
# Required so `shopify app deploy` pushes this app config (access_scopes, URLs,
# proxy, webhooks) to the Partner Dashboard — not just extensions. Without it the
# emptied scopes never reach Shopify and the Protected Customer Data 403 persists.
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# This app is display-only: it uses app-owned metafields, billing, and basic shop
# info — none of which require access scopes. Requesting order/product scopes here
# pulled the app under Protected Customer Data enforcement and broke OAuth (403).
scopes = ""

[auth]
redirect_urls = [ "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/auth/callback" ]

[app_proxy]
url = "https://ezjxcaxfp8j4m9s210rcbfrv.91.239.208.85.sslip.io/api/floating-cart"
subpath = "floating-cart"
prefix = "apps"

[pos]
embedded = false
